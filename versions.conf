# =============================================================================
#  versions.conf - upstream components bash4humans downloads, pinned.
#  `b4h update` re-reads this file; change a line here to move a pin.
# =============================================================================

# ble.sh - line editor (autosuggestions, highlighting, menus). BSD-3-Clause.
# Built from this commit with make + gawk; if either is missing, the
# prebuilt nightly tarball is used instead (unpinned, reported by b4h doctor).
B4H_BLE_REPO=https://github.com/akinomyoga/ble.sh.git
B4H_BLE_COMMIT=152942758f567e51fd17bdc7b3783d27b3c476aa   # 2026-10-31
B4H_BLE_NIGHTLY=https://github.com/akinomyoga/ble.sh/releases/download/nightly/ble-nightly.tar.xz

# fzf - fuzzy finder (Ctrl+R, Ctrl+T, Alt+C, TAB). MIT. Static Go binary.
B4H_FZF_VERSION=0.75.0
B4H_FZF_SHA256_amd64=0d6640f83582d991cf429754baad64b07e3a4e439a6019670f4b91da1314141c
B4H_FZF_SHA256_arm64=bd0717badb6a5620387e014bb94209aac4d9eab6ab77b5348eabb0833aeb4d59

# bash-completion - completions for several hundred commands. GPL-2.0.
B4H_BASHCOMP_VERSION=2.18.0
B4H_BASHCOMP_SHA256=88bcf85124f77f74f2f2f8bcd16ac4382d807a827ede742a64940c7116aea33f

# b4h-tool - this project's Rust helper (zmv, "did you mean", converting
# ~/.p10k.zsh). MIT. The static binary of the release v$B4H_TOOL_VERSION is
# downloaded and checked against the SHA-256 pinned here; with no pin for a
# machine, against the release's SHA256SUMS. Otherwise (or when the download
# fails) it is built from tools/b4h-tool if cargo is present.
B4H_TOOL_VERSION=0.3.8
B4H_TOOL_URL=https://github.com/GladTechInfo/bash4humans/releases/download/v${B4H_TOOL_VERSION}
B4H_TOOL_SHA256_amd64=
B4H_TOOL_SHA256_arm64=

# gitstatus - Powerlevel10k's git engine (gitstatusd daemon + bash bindings).
# GPL-3.0. Its own installer then fetches the gitstatusd binary and checks
# it against the SHA-256 listed in its install.info.
B4H_GITSTATUS_VERSION=1.5.5
B4H_GITSTATUS_SHA256=ed9e41487638591386b947b1944ab9cc3b434d8c8b47df7acade1200e76a8ed4
